# Configuration Alembic — migrations du schéma PostgreSQL.
#
# À exécuter depuis la racine du projet :
#   alembic upgrade head          # applique toutes les migrations
#   alembic revision -m "..."     # crée une nouvelle migration
#
# L'URL de connexion n'est pas définie ici : elle est lue depuis DATABASE_URL
# (.env) dans backend/migrations/env.py. Surcharge ponctuelle possible :
#   alembic -x db_url=sqlite:///test.db upgrade head

[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
