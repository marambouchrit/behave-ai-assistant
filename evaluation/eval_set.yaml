# Jeu d'évaluation du retrieval BeHave.
#
# Rédigé à partir du contenu réel des guides indexés — À RELIRE ET ENRICHIR,
# idéalement avec de vraies questions d'utilisateurs.
#
# Chaque question :
#   id        : identifiant stable
#   question  : texte posé par l'utilisateur
#   in_scope  : true si la documentation contient la réponse
#   kind      : (hors périmètre) "easy" = sans rapport, "hard" = domaine proche
#   expected  : (dans le périmètre) emplacements qui contiennent la réponse ;
#               un chunk est correct s'il vient de `document` ET, si précisé,
#               si sa section contient l'un des `sections` (sous-chaîne,
#               insensible à la casse) ou si sa page est dans `pages`.
#
# Métriques : python -m evaluation.run_eval

questions:

  # ── BeHave Master Data (DOCX, français) ──────────────────────────────────
  - id: md-template-client
    question: Comment générer le template Excel pour créer un client ?
    in_scope: true
    expected:
      - document: BeHave_Master_Data_User_Guide.docx
        sections: [Génération de Template Excel]
  - id: md-run-id
    question: À quoi sert le RUN_ID dans le fichier Excel de Master Data ?
    in_scope: true
