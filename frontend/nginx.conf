server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Upload admin : un peu au-dessus de MAX_UPLOAD_SIZE_MB (20 Mo), le backend fait foi.
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # API : préfixe /api retiré avant transmission au backend.
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Reranking + appel LLM : jusqu'à quelques secondes par question.
        proxy_read_timeout 120s;
    }

    # Application React : toute route inconnue sert index.html (React Router).
    location / {
        try_files $uri /index.html;
    }
}
