# BeHave Assistant — déploiement complet.
#
#   docker compose up -d --build                  # construire et démarrer
#   docker compose run --rm api python -m ingestion.run_indexation --reset
#   docker compose exec api python -m backend.manage create-user --username admin --role admin
#
# Application : http://localhost:8080  (API : http://localhost:8080/api/docs)
# Port modifiable avec FRONTEND_PORT dans .env si 8080 est déjà pris.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-behave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB:       ${POSTGRES_DB:-behave_db}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    # Valeurs propres au conteneur : elles priment sur celles de .env
    # (DATABASE_URL et chemins locaux pensés pour un lancement hors Docker).
    environment:
      # Pilote explicite : SQLAlchemy >= 2.1 utilise psycopg (v3) par défaut.
      DATABASE_URL:      postgresql+psycopg2://${POSTGRES_USER:-behave}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-behave_db}
      CHROMA_DB_DIR:     /app/data/chroma_db
      DOCUMENTS_DIR:     /app/data/documents
      UPLOADED_DOCS_DIR: /app/data/uploaded_docs
      MANIFEST_PATH:     /app/data/manifest.yaml
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
